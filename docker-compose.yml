# Chạy: tạo file .env (xem .env.example), rồi `docker compose up -d --build`
# Mở http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '${APP_PORT:-8080}:5000'
    environment:
      MONGO_URI: mongodb://mongo:27017/fileshare
      JWT_SECRET: ${JWT_SECRET:?Hãy đặt JWT_SECRET trong file .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-200}
      DEFAULT_QUOTA_MB: ${DEFAULT_QUOTA_MB:-2048}
    volumes:
      - uploads:/data/uploads

volumes:
  mongo-data:
  uploads:
